[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Layered machine-vision poka-yoke inspection with traceability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["pokayoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
